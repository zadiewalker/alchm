# Firebase Studio Build Configuration - NPM ENFORCEMENT
# This file configures Firebase Studio to use npm over pnpm/yarn
# Auto-detection will identify Node.js based on package.json

[build]
  exclude = [
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    ".pnpm-store/",
    "yarn.lock",
    ".yarnrc.yml"
  ]

# Auto-detect Node.js buildpack instead of explicit specification
# Firebase Studio will use Google Cloud buildpacks based on package.json
#
# Alternative: If auto-detection fails, uncomment the following:
# [[build.buildpacks]]
#   uri = "gcr.io/buildpacks/nodejs"

[[build.env]]
  name = "NPM_CONFIG_PACKAGE_MANAGER_STRICT"
  value = "true"

[[build.env]]
  name = "NPM_CONFIG_ENGINE_STRICT"
  value = "true"

[[build.env]]
  name = "SKIP_PNPM"
  value = "true"