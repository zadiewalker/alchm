<!DOCTYPE html>
<html>
<head>
    <title>Simple Firebase Test</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        window.testBasicFirebase = async function() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing basic Firebase initialization...</p>';
            
            try {
                // Use exact config from your .env.local
                const firebaseConfig = {
                    apiKey: "AIzaSyCqjfzvykK6q55vLH7F0FEuyK0cppGhD3w",
                    authDomain: "alchm-digital-sanctuary.firebaseapp.com", 
                    projectId: "alchm-digital-sanctuary",
                    storageBucket: "alchm-digital-sanctuary.appspot.com",
                    messagingSenderId: "10211111067",
                    appId: "1:10211111067:web:4f23562b8a1f63cd8c963e",
                    measurementId: "G-0RPJ2D5M1R"
                };

                // Step 1: Initialize Firebase
                const app = initializeApp(firebaseConfig, 'test-' + Date.now());
                results.innerHTML += '<p>✅ Firebase app initialized</p>';
                
                // Step 2: Get Auth instance
                const auth = getAuth(app);
                results.innerHTML += '<p>✅ Auth instance created</p>';
                
                // Step 3: Create Google provider
                const provider = new GoogleAuthProvider();
                provider.addScope('profile');
                provider.addScope('email');
                results.innerHTML += '<p>✅ Google provider configured</p>';
                
                // Step 4: Attempt sign-in
                results.innerHTML += '<p>🔄 Attempting Google sign-in...</p>';
                const result = await signInWithPopup(auth, provider);
                
                results.innerHTML += `
                    <div style="color: green; background: rgba(0,255,0,0.1); padding: 15px; border-radius: 8px; margin-top: 10px;">
                        <h3>🎉 SUCCESS!</h3>
                        <p><strong>User:</strong> ${result.user.displayName}</p>
                        <p><strong>Email:</strong> ${result.user.email}</p>
                        <p><strong>UID:</strong> ${result.user.uid}</p>
                    </div>
                `;
                
            } catch (error) {
                console.error('Detailed error:', error);
                
                let troubleshooting = '';
                if (error.code === 'auth/api-key-not-valid') {
                    troubleshooting = `
                        <h4>🔧 API Key Issue:</h4>
                        <p>The API key is invalid or restricted. Check Firebase Console → Project Settings.</p>
                    `;
                } else if (error.code === 'auth/unauthorized-domain') {
                    troubleshooting = `
                        <h4>🏠 Domain Issue:</h4>
                        <p>Add ${window.location.host} to Firebase Console → Authentication → Settings → Authorized domains.</p>
                    `;
                } else if (error.code === 'auth/operation-not-allowed') {
                    troubleshooting = `
                        <h4>🚫 Provider Issue:</h4>
                        <p>Enable Google sign-in in Firebase Console → Authentication → Sign-in method.</p>
                    `;
                } else if (error.code === 'auth/popup-blocked') {
                    troubleshooting = `
                        <h4>🚧 Popup Blocked:</h4>
                        <p>Allow popups for this site and try again.</p>
                    `;
                }
                
                results.innerHTML += `
                    <div style="color: red; background: rgba(255,0,0,0.1); padding: 15px; border-radius: 8px; margin-top: 10px;">
                        <h3>❌ Error Details</h3>
                        <p><strong>Code:</strong> ${error.code}</p>
                        <p><strong>Message:</strong> ${error.message}</p>
                        <p><strong>Domain:</strong> ${window.location.host}</p>
                        ${troubleshooting}
                    </div>
                `;
            }
        };
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #a4b792 0%, #8fa37c 100%);
            color: white;
            border-radius: 20px;
        }
        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        #results {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            min-height: 80px;
        }
    </style>
</head>
<body>
    <h1>🔥 Simple Firebase Authentication Test</h1>
    <p>Step-by-step Firebase auth testing to isolate the exact issue.</p>
    
    <button onclick="testBasicFirebase()" style="width: 100%;">
        🧪 Test Firebase + Google Auth
    </button>
    
    <div id="results">
        <p>Click the test button to run comprehensive Firebase authentication testing.</p>
    </div>
</body>
</html>
