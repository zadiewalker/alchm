<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In - ALCHM (FIXED)</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    /* Fallback styles in case Tailwind doesn't load */
    .gradient-bg { background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%); }
    .btn-primary { 
      background: #2563eb; 
      color: white; 
      padding: 12px 16px; 
      border-radius: 8px; 
      border: none; 
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary {
      background: white;
      color: #374151;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .btn-secondary:hover { background: #f9fafb; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-50 to-pink-50 gradient-bg">
  <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 container">
    <div class="max-w-md w-full space-y-8 card bg-white p-8 rounded-2xl shadow-lg">
      <div class="text-center">
        <h2 class="mt-6 text-3xl font-bold text-gray-900 tracking-tight mb-2">
          🧘‍♀️ Welcome to ALCHM
        </h2>
        <p class="text-gray-600 text-lg">
          Private by design. Encrypted by default.
        </p>
        <div class="mt-4 p-2 bg-green-50 border border-green-200 rounded-lg">
          <p class="text-green-800 text-sm font-medium">🔧 AUTH ISSUE FIXED</p>
        </div>
      </div>
      
      <div class="space-y-4">
        <button id="google-signin" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors btn-primary">
          <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>
        
        <button id="redirect-signin" class="w-full flex justify-center items-center py-3 px-4 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors btn-secondary">
          <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google via Redirect (Alternative)
        </button>
      </div>
      
      <div class="mt-6 text-center">
        <div class="text-xs text-gray-500 space-y-1">
          <p><strong>🔐 Features:</strong></p>
          <p>• End-to-end encryption • Trauma-informed design</p>
          <p>• AI-powered insights • Privacy first</p>
        </div>
      </div>
      
      <div id="status" class="text-center text-sm"></div>
    </div>
  </div>

  <script>
    console.log('🔧 AUTH-FIXED: Enhanced authentication system loading...');
    
    // Initialize Firebase with correct project configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCqjfzvykK6q55vLH7F0FEuyK0cppGhD3w",
      authDomain: "alchm-digital-sanctuary.firebaseapp.com", 
      projectId: "alchm-digital-sanctuary",
      storageBucket: "alchm-digital-sanctuary.firebasestorage.app",
      messagingSenderId: "171911707668",
      appId: "1:171911707668:web:9750f89ed6f6352a257b01",
      measurementId: "G-8YE7D8RQ0P"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    console.log('🔧 AUTH-FIXED: Firebase initialized');
    
    // Check for redirect results first
    console.log('🔧 AUTH-FIXED: Checking for redirect results...');
    auth.getRedirectResult()
      .then((result) => {
        if (result && result.user) {
          console.log('🔧 AUTH-FIXED: Redirect sign-in successful:', result.user);
          handleAuthSuccess(result.user);
        } else {
          console.log('🔧 AUTH-FIXED: No redirect result found');
        }
      })
      .catch((error) => {
        console.error('🔧 AUTH-FIXED: Redirect result error:', error);
        if (error.code !== 'auth/no-redirect-operation-in-progress') {
          handleAuthError(error);
        }
      });
    
    // Enhanced auth state listener
    auth.onAuthStateChanged((user) => {
      console.log('🔧 AUTH-FIXED: Auth state changed:', user ? user.uid : 'no user');
      const status = document.getElementById('status');
      
      if (user) {
        handleAuthSuccess(user);
      } else {
        status.innerHTML = '<span class="text-gray-500">Please sign in to continue</span>';
      }
    });
    
    function handleAuthSuccess(user) {
      console.log('🔧 AUTH-FIXED: Handling successful authentication for:', user.email);
      const status = document.getElementById('status');
      
      status.innerHTML = `
        <div class="p-3 bg-green-50 border border-green-200 rounded-lg">
          <span class="text-green-800 font-medium">✅ Success!</span><br>
          <span class="text-green-600 text-xs">Welcome ${user.displayName || user.email}!</span><br>
          <span class="text-green-600 text-xs">Redirecting in 2 seconds...</span>
        </div>
      `;
      
      // Redirect after successful authentication  
      setTimeout(() => {
        console.log('🔧 AUTH-FIXED: Redirecting to homepage...');
        // Add a flag to indicate successful auth
        sessionStorage.setItem('authSuccess', 'true');
        sessionStorage.setItem('userEmail', user.email);
        sessionStorage.setItem('userName', user.displayName || user.email);
        window.location.href = '/';
      }, 2000);
    }
    
    function handleAuthError(error) {
      console.error('🔧 AUTH-FIXED: Authentication error:', error);
      const status = document.getElementById('status');
      
      let errorMessage = 'Authentication failed';
      
      if (error.code === 'auth/popup-blocked') {
        errorMessage = 'Popup blocked - please allow popups and try redirect method';
      } else if (error.code === 'auth/popup-closed-by-user') {
        errorMessage = 'Sign-in cancelled';
      } else if (error.code === 'auth/unauthorized-domain') {
        errorMessage = 'Domain not authorized - using redirect method';
        return; // Don't show error, will try redirect
      } else if (error.code === 'auth/admin-restricted-operation') {
        errorMessage = 'Auth restrictions detected - trying alternative method';
      }
      
      status.innerHTML = `
        <div class="p-3 bg-yellow-50 border border-yellow-200 rounded-lg">
          <span class="text-yellow-700 font-medium">⚠️ ${errorMessage}</span><br>
          <span class="text-yellow-600 text-xs">Code: ${error.code}</span>
        </div>
      `;
    }
    
    // Enhanced popup sign-in with admin-restriction handling
    function signInWithPopup() {
      console.log('🔧 AUTH-FIXED: Attempting popup sign-in...');
      const status = document.getElementById('status');
      status.innerHTML = '<span class="text-blue-600">🔄 Opening Google Sign-In...</span>';
      
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.addScope('profile');
      provider.addScope('email');
      provider.setCustomParameters({
        prompt: 'select_account'
      });
      
      auth.signInWithPopup(provider)
        .then((result) => {
          console.log('🔧 AUTH-FIXED: Popup sign-in successful');
          // Success handled by auth state listener
        })
        .catch((error) => {
          console.error('🔧 AUTH-FIXED: Popup sign-in failed:', error);
          
          // If popup fails due to restrictions, automatically try redirect
          if (error.code === 'auth/admin-restricted-operation' || 
              error.code === 'auth/unauthorized-domain' ||
              error.code === 'auth/popup-blocked') {
            
            console.log('🔧 AUTH-FIXED: Popup failed, automatically trying redirect...');
            status.innerHTML = '<span class="text-yellow-600">🔄 Popup blocked - switching to redirect method...</span>';
            
            setTimeout(() => {
              signInWithRedirect();
            }, 1000);
          } else {
            handleAuthError(error);
          }
        });
    }
    
    // Redirect sign-in method
    function signInWithRedirect() {
      console.log('🔧 AUTH-FIXED: Using redirect sign-in method...');
      const status = document.getElementById('status');
      status.innerHTML = '<span class="text-blue-600">🔄 Redirecting to Google...</span>';
      
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.addScope('profile');
      provider.addScope('email');
      provider.setCustomParameters({
        prompt: 'select_account'
      });
      
      auth.signInWithRedirect(provider)
        .catch((error) => {
          console.error('🔧 AUTH-FIXED: Redirect sign-in failed:', error);
          handleAuthError(error);
        });
    }
    
    // Event listeners
    document.getElementById('google-signin').addEventListener('click', signInWithPopup);
    document.getElementById('redirect-signin').addEventListener('click', signInWithRedirect);
    
    console.log('🔧 AUTH-FIXED: Enhanced authentication system ready');
  </script>
</body>
</html>
