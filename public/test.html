<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ALCHM Static Test</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #8B9A7C, #A8B5A0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
    }
    .container {
      text-align: center;
      padding: 20px;
      max-width: 400px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .btn {
      padding: 12px 24px;
      background: #D4A84B;
      border: none;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      margin: 10px;
      font-size: 16px;
      font-weight: 500;
    }
    .btn:hover {
      background: #E5C97D;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      min-height: 50px;
    }
    .success {
      color: #90EE90;
    }
    .error {
      color: #FFB6C1;
    }
    .info {
      color: #87CEEB;
    }
    .nav-links {
      margin-top: 30px;
    }
    .nav-links a {
      display: inline-block;
      margin: 5px 10px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.1);
      color: white;
      text-decoration: none;
      border-radius: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🪲</div>
    <h1>ALCHM Static Test</h1>
    <p>Testing basic functionality step by step</p>
    
    <button class="btn" onclick="testHTML()">1. Test HTML/CSS</button>
    <button class="btn" onclick="testJS()">2. Test JavaScript</button>
    <button class="btn" onclick="testCapacitor()">3. Test Capacitor</button>
    <button class="btn" onclick="testSplash()">4. Test Splash Screen</button>
    
    <div id="result" class="result">Click buttons above to test each layer...</div>
    
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/dashboard/">Dashboard</a>
      <a href="/test-simple/">Simple React</a>
    </div>
  </div>

  <script>
    console.log('🏁 Static test page loading')
    
    let testResults = []
    
    function updateResult() {
      const resultDiv = document.getElementById('result')
      resultDiv.innerHTML = testResults.join('<br>')
    }
    
    function addResult(message, type = 'info') {
      const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'
      testResults.push(`<span class="${type}">${icon} ${message}</span>`)
      updateResult()
      console.log(`${icon} ${message}`)
    }
    
    function testHTML() {
      addResult('HTML structure loaded', 'success')
      addResult('CSS styles applied', 'success')
      addResult('DOM manipulation works', 'success')
    }
    
    function testJS() {
      try {
        // Test basic JS features
        const now = new Date().toLocaleTimeString()
        addResult(`JavaScript works - Time: ${now}`, 'success')
        
        // Test localStorage
        localStorage.setItem('test', 'works')
        const stored = localStorage.getItem('test')
        if (stored === 'works') {
          addResult('localStorage works', 'success')
        } else {
          addResult('localStorage failed', 'error')
        }
        
        // Test async
        setTimeout(() => {
          addResult('setTimeout works', 'success')
        }, 100)
        
        addResult('All JavaScript tests passed', 'success')
      } catch (error) {
        addResult(`JavaScript error: ${error.message}`, 'error')
      }
    }
    
    function testCapacitor() {
      if (window.Capacitor) {
        addResult('Capacitor detected!', 'success')
        addResult(`Platform: ${window.Capacitor.getPlatform()}`, 'info')
        addResult(`Native: ${window.Capacitor.isNativePlatform()}`, 'info')
        
        // Test device info
        if (window.Capacitor.Plugins?.Device) {
          window.Capacitor.Plugins.Device.getInfo().then(info => {
            addResult(`Device: ${info.model} ${info.osVersion}`, 'info')
          }).catch(err => {
            addResult(`Device info error: ${err.message}`, 'error')
          })
        }
        
        // Test network
        if (window.Capacitor.Plugins?.Network) {
          window.Capacitor.Plugins.Network.getStatus().then(status => {
            addResult(`Network: ${status.connected ? 'Connected' : 'Disconnected'}`, 'info')
          }).catch(err => {
            addResult(`Network error: ${err.message}`, 'error')
          })
        }
        
      } else {
        addResult('No Capacitor detected (running in browser)', 'info')
      }
    }
    
    async function testSplash() {
      if (window.Capacitor && window.Capacitor.Plugins?.SplashScreen) {
        try {
          addResult('Attempting to hide splash screen...', 'info')
          await window.Capacitor.Plugins.SplashScreen.hide({
            fadeOutDuration: 300
          })
          addResult('Splash screen hidden successfully', 'success')
        } catch (error) {
          addResult(`Splash error: ${error.message}`, 'error')
        }
      } else {
        addResult('SplashScreen plugin not available', 'info')
      }
    }

    // Auto-test on load
    window.addEventListener('load', () => {
      addResult('Page loaded successfully', 'success')
      console.log('🏁 Static test page ready')
      
      // Auto-run basic tests after a delay
      setTimeout(() => {
        testHTML()
        setTimeout(testJS, 500)
        setTimeout(testCapacitor, 1000)
      }, 1000)
    })
    
    // Error handler
    window.addEventListener('error', (event) => {
      addResult(`Global error: ${event.error?.message || event.message}`, 'error')
      console.error('Global error:', event)
    })
  </script>
</body>
</html>
