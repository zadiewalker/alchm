<script>
// ALCHM Emergency Cache Buster - v1763242665984
(function() {
  const CURRENT_VERSION = 'v1763242665984';
  const STORED_VERSION = localStorage.getItem('alchm-version');
  
  if (STORED_VERSION !== CURRENT_VERSION) {
    console.log('🔄 Version change detected, clearing caches');
    localStorage.setItem('alchm-version', CURRENT_VERSION);
    
    // Clear all caches
    if ('caches' in window) {
      caches.keys().then(names => {
        names.forEach(name => {
          if (name.includes('alchm')) caches.delete(name);
        });
      });
    }
    
    // Force reload after cache clear
    setTimeout(() => window.location.reload(true), 100);
  }
  
  // Register emergency service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/emergency-sw.js?v=' + CURRENT_VERSION, {
      updateViaCache: 'none'
    }).then(registration => {
      console.log('✅ Emergency SW registered:', CURRENT_VERSION);
      
      // Force update check every 30 seconds
      setInterval(() => {
        registration.update();
      }, 30000);
      
      // Listen for SW messages
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data.type === 'FORCE_RELOAD') {
          window.location.reload(true);
        }
      });
      
    }).catch(console.error);
  }
})();
</script></head>
<body class="min-h-screen bg-gradient-to-br from-purple-50 to-pink-50 gradient-bg">
  <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 container">
    <div class="max-w-md w-full space-y-8 card">
      <div class="text-center">
        <h2 class="mt-6 text-3xl font-bold text-gray-900 tracking-tight mb-2">
          🧘‍♀️ Welcome to ALCHM
        </h2>
        <p class="text-gray-600 text-lg">
          Private by design. Encrypted by default.
        </p>
      </div>
      
      <div class="space-y-4">
        <button id="google-signin" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors btn-primary">
          <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>
        
        <button id="apple-signin" class="w-full flex justify-center items-center py-3 px-4 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors btn-secondary">
          <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          Continue with Apple
        </button>
      </div>
      
      <div class="mt-6 text-center">
        <div class="text-xs text-gray-500 space-y-1">
          <p><strong>🔐 Features:</strong></p>
          <p>• End-to-end encryption • Trauma-informed design</p>
          <p>• AI-powered insights • Privacy first</p>
        </div>
      </div>
      
      <div id="status" class="text-center text-sm"></div>
    </div>
  </div>

  <script>
    console.log('Auth page script loading...');
    
    // Initialize Firebase with correct project configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCqjfzvykK6q55vLH7F0FEuyK0cppGhD3w",
      authDomain: "alchm-digital-sanctuary.firebaseapp.com", 
      projectId: "alchm-digital-sanctuary",
      storageBucket: "alchm-digital-sanctuary.firebasestorage.app",
      messagingSenderId: "171911707668",
      appId: "1:171911707668:web:9750f89ed6f6352a257b01",
      measurementId: "G-8YE7D8RQ0P"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    console.log('Firebase initialized');
    
    // Handle redirect result when user returns from Google
    auth.getRedirectResult()
      .then((result) => {
        if (result.user) {
          console.log('Redirect sign-in successful:', result.user);
          // The onAuthStateChanged listener will handle the rest
        }
      })
      .catch((error) => {
        console.error('Redirect result error:', error);
        const status = document.getElementById('status');
        if (status) {
          if (error.code === 'auth/unauthorized-domain') {
            status.innerHTML = '<div class="p-3 bg-red-50 border border-red-200 rounded-lg"><span class="text-red-600 font-medium">❌ Unauthorized Domain</span><br><span class="text-red-500 text-xs">Please add this domain to Firebase Auth authorized domains.</span></div>';
          } else {
            status.innerHTML = '<div class="p-3 bg-red-50 border border-red-200 rounded-lg"><span class="text-red-600">❌ Sign-in failed: ' + error.message + '</span><br><span class="text-red-500 text-xs">Code: ' + error.code + '</span></div>';
          }
        }
      });
    
    // User bootstrap function
    function bootstrapUser(user) {
      const userProfile = {
        uid: user.uid,
        email: user.email,
        displayName: user.displayName,
        photoURL: user.photoURL,
        providers: user.providerData ? user.providerData.map(p => p.providerId) : [],
        createdAt: new Date().toISOString(),
        lastLoginAt: new Date().toISOString(),
        isNewUser: user.metadata.creationTime === user.metadata.lastSignInTime
      };
      console.log('User profile created:', userProfile);
      return Promise.resolve(userProfile);
    }
    
    // Auth state change listener
    auth.onAuthStateChanged(async (user) => {
      console.log('Auth state changed:', user);
      const status = document.getElementById('status');
      if (user) {
        status.innerHTML = '<div class="p-3 bg-green-50 border border-green-200 rounded-lg"><span class="text-green-800 font-medium">✅ Welcome!</span><br><span class="text-green-600 text-xs">Creating session...</span></div>';
        
        try {
          console.log('User authenticated successfully:', user.uid, user.email);
          
          status.innerHTML = '<div class="p-3 bg-green-50 border border-green-200 rounded-lg"><span class="text-green-800 font-medium">✅ Success!</span><br><span class="text-green-600 text-xs">User: ' + (user.displayName || user.email) + '</span><br><span class="text-green-600 text-xs">Preparing redirect...</span></div>';
          
          // Bootstrap user 
          await bootstrapUser(user);
          console.log('User bootstrap completed');
          
          // Wait a bit longer to ensure auth state is set
          status.innerHTML = '<div class="p-3 bg-blue-50 border border-blue-200 rounded-lg"><span class="text-blue-800 font-medium">🔄 Auth state confirmed</span><br><span class="text-blue-600 text-xs">Redirecting in 3 seconds...</span></div>';
          
          // Get redirect URL from query params or default to homepage
          const urlParams = new URLSearchParams(window.location.search);
          const redirectUrl = urlParams.get('redirect') || '/';
          
          console.log('Redirecting to:', redirectUrl);
          
          setTimeout(() => {
            console.log('Executing redirect now...');
            window.location.href = redirectUrl;
          }, 3000);
        } catch (error) {
          console.error('Error during authentication:', error);
          status.innerHTML = '<div class="p-3 bg-red-50 border border-red-200 rounded-lg"><span class="text-red-600">❌ Authentication error: ' + error.message + '</span></div>';
        }
      } else {
        status.innerHTML = '<span class="text-gray-500">Please sign in to continue</span>';
      }
    });
    
    let isSigningIn = false;
    
    // Google Sign-In function - using popup method to avoid COEP issues
    function signInWithGoogle() {
      console.log('=== STARTING GOOGLE SIGN-IN ===');
      
      // Prevent multiple simultaneous sign-in attempts
      if (isSigningIn) {
        console.log('Sign-in already in progress, ignoring click');
        return;
      }
      
      isSigningIn = true;
      const status = document.getElementById('status');
      status.innerHTML = '<span class="text-blue-600">🔄 Opening Google Sign-In popup...</span>';
      
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.addScope('profile');
      provider.addScope('email');
      provider.setCustomParameters({
        prompt: 'select_account'
      });
      
      console.log('About to call signInWithPopup...');
      
      // Use popup method instead of redirect to avoid COEP issues
      auth.signInWithPopup(provider)
        .then(async (result) => {
          console.log('Sign-in successful:', result.user);
          isSigningIn = false;
          
          // Handle auth success directly here instead of waiting for onAuthStateChanged
          const user = result.user;
          status.innerHTML = '<div class="p-3 bg-green-50 border border-green-200 rounded-lg"><span class="text-green-800 font-medium">✅ Success!</span><br><span class="text-green-600 text-xs">User: ' + (user.displayName || user.email) + '</span><br><span class="text-green-600 text-xs">Preparing redirect...</span></div>';
          
          try {
            // Bootstrap user
            await bootstrapUser(user);
            console.log('User bootstrap completed');
            
            // Show redirect message
            status.innerHTML = '<div class="p-3 bg-blue-50 border border-blue-200 rounded-lg"><span class="text-blue-800 font-medium">🔄 Auth complete</span><br><span class="text-blue-600 text-xs">Redirecting in 2 seconds...</span></div>';
            
            // Get redirect URL from query params or default to homepage
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect') || '/';
            
            console.log('Redirecting to:', redirectUrl);
            
            setTimeout(() => {
              console.log('Executing redirect now...');
              window.location.href = redirectUrl;
            }, 2000);
          } catch (error) {
            console.error('Error during post-auth processing:', error);
            status.innerHTML = '<div class="p-3 bg-red-50 border border-red-200 rounded-lg"><span class="text-red-600">❌ Auth error: ' + error.message + '</span></div>';
          }
        })
        .catch((error) => {
          console.error('=== SIGN-IN ERROR ===');
          console.error('Error code:', error.code);
          console.error('Error message:', error.message);
          console.error('Full error:', error);
          isSigningIn = false;
          
          if (error.code === 'auth/popup-closed-by-user') {
            status.innerHTML = '<span class="text-gray-500">Sign-in cancelled by user</span>';
            console.log('User closed the popup');
          } else if (error.code === 'auth/cancelled-popup-request') {
            status.innerHTML = '<span class="text-yellow-600">⚠️ Please wait for the current sign-in to complete</span>';
            console.log('Popup request cancelled - multiple popups');
          } else if (error.code === 'auth/popup-blocked') {
            status.innerHTML = '<div class="p-3 bg-yellow-50 border border-yellow-200 rounded-lg"><span class="text-yellow-700">❌ Popup blocked by browser</span><br><span class="text-yellow-600 text-xs">Please allow popups and try again</span></div>';
            console.log('Popup was blocked by browser');
          } else {
            status.innerHTML = '<div class="p-3 bg-red-50 border border-red-200 rounded-lg"><span class="text-red-600">❌ Error: ' + error.message + '</span><br><span class="text-red-500 text-xs">Code: ' + error.code + '</span></div>';
            console.log('Unknown sign-in error:', error.code);
          }
        });
    }
    
    // Apple Sign-In function
    function showAppleMessage() {
      console.log('Apple sign-in clicked');
      document.getElementById('status').innerHTML = 
        '<div class="p-3 bg-yellow-50 border border-yellow-200 rounded-lg"><span class="text-yellow-700">🍎 Apple Sign-In coming soon</span></div>';
    }
    
    // Wait for page to load completely
    window.addEventListener('load', () => {
      console.log('Page loaded, setting up buttons');
      
      // Set up Google button
      const googleBtn = document.getElementById('google-signin');
      if (googleBtn) {
        console.log('Found Google button, adding onclick');
        googleBtn.onclick = signInWithGoogle;
        googleBtn.addEventListener('click', signInWithGoogle);
      } else {
        console.error('Google button not found!');
      }
      
      // Set up Apple button
      const appleBtn = document.getElementById('apple-signin');
      if (appleBtn) {
        console.log('Found Apple button, adding onclick');
        appleBtn.onclick = showAppleMessage;
        appleBtn.addEventListener('click', showAppleMessage);
      } else {
        console.error('Apple button not found!');
      }
    });
  </script>
</body>
