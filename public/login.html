<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In Fixed - ALCHM</title>
  <!-- Jony Ive Premium Design System -->
  <link rel="stylesheet" href="/styles/jony-ive-mobile-system.css">
  <link rel="stylesheet" href="/styles/core-web-vitals.css">
  <link rel="stylesheet" href="/styles/trauma-informed-animations.css">
  
  <!-- Crisis Resource Preloading -->
  <link rel="dns-prefetch" href="tel:988">
  <link rel="preconnect" href="https://suicidepreventionlifeline.org">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  
  <style>
    /* Premium Authentication Experience */
    body {
      background: linear-gradient(135deg, #a4b792 0%, #93a682 25%, #82956f 50%, #7a8c6a 75%, #6b7d5a 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    .auth-sanctuary {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(164, 183, 146, 0.2);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      transition: all 400ms cubic-bezier(0.215, 0.61, 0.355, 1);
    }
    
    .sage-button {
      background: linear-gradient(135deg, #a4b792 0%, #93a682 100%);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px 32px;
      font-weight: 600;
      transition: all 300ms cubic-bezier(0.215, 0.61, 0.355, 1);
      box-shadow: 0 8px 24px rgba(164, 183, 146, 0.3);
      cursor: pointer;
      width: 100%;
      font-size: 1.125rem;
    }
    
    .sage-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(164, 183, 146, 0.4);
      background: linear-gradient(135deg, #93a682 0%, #82956f 100%);
    }
    
    .sage-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .secondary-button {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(164, 183, 146, 0.3);
      color: #4a5568;
      border-radius: 16px;
      padding: 16px 32px;
      font-weight: 500;
      transition: all 300ms ease;
      cursor: pointer;
      width: 100%;
      font-size: 1.125rem;
    }
    
    .secondary-button:hover {
      background: rgba(164, 183, 146, 0.1);
      transform: translateY(-2px);
    }
    
    .gentle-fade-in {
      animation: gentleFadeIn 0.8s ease-out forwards;
    }
    
    @keyframes gentleFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .page-title {
      color: #2d3748;
      font-size: 2rem;
      font-weight: 200;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    
    .page-subtitle {
      color: #4a5568;
      font-size: 1.125rem;
      font-weight: 300;
      opacity: 0.8;
    }
    
    .status-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(164, 183, 146, 0.2);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    @media (max-width: 768px) {
      .page-title { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <div style="padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="auth-sanctuary gentle-fade-in" style="max-width: 480px; width: 100%; border-radius: 32px; padding: 40px;">
      <div style="text-center; margin-bottom: 32px;">
        <div style="font-size: 4rem; margin-bottom: 20px;">🌿</div>
        <h2 class="page-title">
          🧘‍♀️ ALCHM Authentication
        </h2>
        <p class="page-subtitle">
          Private by design. Encrypted by default.
        </p>
        <div class="status-card" style="margin-top: 24px; background: linear-gradient(135deg, rgba(164, 183, 146, 0.1) 0%, rgba(147, 166, 130, 0.05) 100%); border: 1px solid rgba(164, 183, 146, 0.3);">
          <p style="color: #2d3748; font-size: 0.875rem; font-weight: 600; margin-bottom: 4px;">✅ PREMIUM AUTHENTICATION SYSTEM</p>
          <p style="color: #4a5568; font-size: 0.75rem;">Trauma-informed design with crisis support</p>
        </div>
      </div>
      
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <button id="google-signin" class="sage-button" style="display: flex; align-items: center; justify-content: center; gap: 12px;">
          <span style="font-size: 1.25rem;">🔐</span>
          Continue with Google
        </button>
        
        <button id="redirect-signin" class="secondary-button" style="display: flex; align-items: center; justify-content: center; gap: 12px;">
          <span style="font-size: 1.25rem;">🔄</span>
          Try Redirect Method
        </button>
      </div>
      
      <div id="status" style="text-align: center; margin: 24px 0;"></div>
      
      <div style="text-align: center; margin-top: 32px; padding-top: 24px; border-top: 1px solid rgba(164, 183, 146, 0.2);">
        <div style="color: #4a5568; font-size: 0.875rem;">
          <p style="margin-bottom: 12px; font-weight: 600;">🔐 Premium Features:</p>
          <p style="margin-bottom: 8px;">• End-to-end encryption • Trauma-informed design</p>
          <p>• AI-powered insights • Crisis support integration</p>
        </div>
        
        <!-- Crisis Support -->
        <div style="margin-top: 24px; padding: 16px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 12px;">
          <p style="color: #7f1d1d; font-size: 0.875rem; margin-bottom: 12px;">Need immediate support?</p>
          <button onclick="window.location.href='tel:988'" style="background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; cursor: pointer;">
            🆘 Call 988 Crisis Line
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    console.log('🔧 SIGNIN-FIXED: Loading authentication system...');
    
    // Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCqjfzvykK6q55vLH7F0FEuyK0cppGhD3w",
      authDomain: "alchm-digital-sanctuary.firebaseapp.com", 
      projectId: "alchm-digital-sanctuary",
      storageBucket: "alchm-digital-sanctuary.firebasestorage.app",
      messagingSenderId: "171911707668",
      appId: "1:171911707668:web:9750f89ed6f6352a257b01",
      measurementId: "G-8YE7D8RQ0P"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    console.log('🔧 SIGNIN-FIXED: Firebase initialized');
    
    // Check for redirect results first
    auth.getRedirectResult()
      .then((result) => {
        if (result && result.user) {
          console.log('🔧 SIGNIN-FIXED: Redirect success:', result.user.email);
          handleAuthSuccess(result.user);
        } else {
          console.log('🔧 SIGNIN-FIXED: No redirect result');
        }
      })
      .catch((error) => {
        console.error('🔧 SIGNIN-FIXED: Redirect error:', error);
      });
    
    // Auth state listener
    auth.onAuthStateChanged((user) => {
      if (user) {
        console.log('🔧 SIGNIN-FIXED: User signed in:', user.email);
        handleAuthSuccess(user);
      }
    });
    
    async function handleAuthSuccess(user) {
      console.log('🔧 SIGNIN-FIXED: Handling auth success for:', user.email);
      const status = document.getElementById('status');
      
      status.innerHTML = `
        <div class="p-4 bg-blue-50 border border-blue-200 rounded-lg">
          <p class="text-blue-800 font-bold">🔄 Creating Session...</p>
          <p class="text-blue-700 text-sm">Setting up secure session cookies</p>
        </div>
      `;

      try {
        // Get the user's ID token
        const idToken = await user.getIdToken();
        
        // Create server-side session
        const response = await fetch('/api/auth/session', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ idToken })
        });

        if (!response.ok) {
          throw new Error('Failed to create session');
        }

        const sessionData = await response.json();
        console.log('🔧 SIGNIN-FIXED: Session created successfully');

        status.innerHTML = `
          <div class="p-4 bg-green-50 border border-green-200 rounded-lg">
            <p class="text-green-800 font-bold">🎉 SUCCESS!</p>
            <p class="text-green-700 text-sm">Welcome, ${user.displayName || user.email}!</p>
            <p class="text-green-600 text-xs">Session created successfully</p>
            <button onclick="goToJournal()" class="mt-3 bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 font-medium">
              Continue to Journal →
            </button>
          </div>
        `;
      } catch (error) {
        console.error('🔧 SIGNIN-FIXED: Session creation failed:', error);
        status.innerHTML = `
          <div class="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
            <p class="text-yellow-800 font-bold">⚠️ Session Error</p>
            <p class="text-yellow-700 text-sm">Authentication succeeded but session creation failed</p>
            <p class="text-yellow-600 text-xs">You may need to sign in again</p>
            <button onclick="goToJournal()" class="mt-3 bg-yellow-600 text-white px-6 py-2 rounded-lg hover:bg-yellow-700 font-medium">
              Try Journal Anyway →
            </button>
          </div>
        `;
      }
    }
    
    function handleAuthError(error) {
      console.error('🔧 SIGNIN-FIXED: Auth error:', error);
      const status = document.getElementById('status');
      
      let message = 'Authentication failed';
      if (error.code === 'auth/popup-blocked') {
        message = 'Popup blocked - try the redirect method below';
      } else if (error.code === 'auth/popup-closed-by-user') {
        message = 'Sign-in cancelled by user';
      } else if (error.code === 'auth/admin-restricted-operation') {
        message = 'Admin restrictions detected - using alternative method';
      }
      
      status.innerHTML = `
        <div class="p-3 bg-yellow-50 border border-yellow-200 rounded-lg">
          <p class="text-yellow-700 font-medium">⚠️ ${message}</p>
          <p class="text-yellow-600 text-xs">Error: ${error.code}</p>
        </div>
      `;
    }
    
    function signInWithPopup() {
      console.log('🔧 SIGNIN-FIXED: Starting popup sign-in...');
      const status = document.getElementById('status');
      status.innerHTML = '<p class="text-blue-600">🔄 Opening Google Sign-In popup...</p>';
      
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.addScope('profile');
      provider.addScope('email');
      provider.setCustomParameters({
        prompt: 'select_account'
      });
      
      auth.signInWithPopup(provider)
        .then((result) => {
          console.log('🔧 SIGNIN-FIXED: Popup success!', result.user.email);
        })
        .catch((error) => {
          if (error.code === 'auth/admin-restricted-operation' || 
              error.code === 'auth/popup-blocked') {
            console.log('🔧 SIGNIN-FIXED: Popup failed, trying redirect...');
            status.innerHTML = '<p class="text-yellow-600">🔄 Popup failed - trying redirect method...</p>';
            setTimeout(() => signInWithRedirect(), 1500);
          } else {
            handleAuthError(error);
          }
        });
    }
    
    function signInWithRedirect() {
      console.log('🔧 SIGNIN-FIXED: Starting redirect sign-in...');
      const status = document.getElementById('status');
      status.innerHTML = '<p class="text-blue-600">🔄 Redirecting to Google...</p>';
      
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.addScope('profile');
      provider.addScope('email');
      
      auth.signInWithRedirect(provider)
        .catch((error) => {
          console.error('🔧 SIGNIN-FIXED: Redirect failed:', error);
          handleAuthError(error);
        });
    }
    
    function goToJournal() {
      console.log('🔧 SIGNIN-FIXED: Going to journal...');
      window.location.href = '/journal';
    }
    
    // Event listeners
    document.getElementById('google-signin').addEventListener('click', signInWithPopup);
    document.getElementById('redirect-signin').addEventListener('click', signInWithRedirect);
    
    console.log('🔧 SIGNIN-FIXED: System ready');
  </script>
</body>
</html>
