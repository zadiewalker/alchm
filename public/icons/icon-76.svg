<svg width="76" height="76" viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a4b792;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8fa078;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.52" stdDeviation="0.76" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="76" height="76" rx="13.68" ry="13.68" fill="url(#bg)"/>
  
  <!-- Sacred scarab symbol -->
  <g transform="translate(38, 38)">
    <!-- Scarab body -->
    <ellipse cx="0" cy="0" rx="11.4" ry="19" fill="#ffffff" opacity="0.9" filter="url(#shadow)"/>
    
    <!-- Scarab wings -->
    <ellipse cx="-7.6000000000000005" cy="-3.8000000000000003" rx="6.08" ry="11.4" fill="#ffffff" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="7.6000000000000005" cy="-3.8000000000000003" rx="6.08" ry="11.4" fill="#ffffff" opacity="0.7" transform="rotate(20)"/>
    
    <!-- Sacred geometry -->
    <circle cx="0" cy="-6.08" r="2.28" fill="#2d3748" opacity="0.6"/>
    <circle cx="0" cy="0" r="1.52" fill="#2d3748" opacity="0.8"/>
    <circle cx="0" cy="6.08" r="2.28" fill="#2d3748" opacity="0.6"/>
  </g>
  
  <!-- App name hint for larger sizes -->
  
</svg>