<svg width="167" height="167" viewBox="0 0 167 167" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a4b792;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8fa078;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.34" stdDeviation="1.67" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="167" height="167" rx="30.06" ry="30.06" fill="url(#bg)"/>
  
  <!-- Sacred scarab symbol -->
  <g transform="translate(83.5, 83.5)">
    <!-- Scarab body -->
    <ellipse cx="0" cy="0" rx="25.05" ry="41.75" fill="#ffffff" opacity="0.9" filter="url(#shadow)"/>
    
    <!-- Scarab wings -->
    <ellipse cx="-16.7" cy="-8.35" rx="13.36" ry="25.05" fill="#ffffff" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="16.7" cy="-8.35" rx="13.36" ry="25.05" fill="#ffffff" opacity="0.7" transform="rotate(20)"/>
    
    <!-- Sacred geometry -->
    <circle cx="0" cy="-13.36" r="5.01" fill="#2d3748" opacity="0.6"/>
    <circle cx="0" cy="0" r="3.34" fill="#2d3748" opacity="0.8"/>
    <circle cx="0" cy="13.36" r="5.01" fill="#2d3748" opacity="0.6"/>
  </g>
  
  <!-- App name hint for larger sizes -->
  
</svg>