<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a4b792;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8fa078;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.4" stdDeviation="0.2" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="20" height="20" rx="3.5999999999999996" ry="3.5999999999999996" fill="url(#bg)"/>
  
  <!-- Sacred scarab symbol -->
  <g transform="translate(10, 10)">
    <!-- Scarab body -->
    <ellipse cx="0" cy="0" rx="3" ry="5" fill="#ffffff" opacity="0.9" filter="url(#shadow)"/>
    
    <!-- Scarab wings -->
    <ellipse cx="-2" cy="-1" rx="1.6" ry="3" fill="#ffffff" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="2" cy="-1" rx="1.6" ry="3" fill="#ffffff" opacity="0.7" transform="rotate(20)"/>
    
    <!-- Sacred geometry -->
    <circle cx="0" cy="-1.6" r="0.6" fill="#2d3748" opacity="0.6"/>
    <circle cx="0" cy="0" r="0.4" fill="#2d3748" opacity="0.8"/>
    <circle cx="0" cy="1.6" r="0.6" fill="#2d3748" opacity="0.6"/>
  </g>
  
  <!-- App name hint for larger sizes -->
  
</svg>