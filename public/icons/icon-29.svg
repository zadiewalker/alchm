<svg width="29" height="29" viewBox="0 0 29 29" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a4b792;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8fa078;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.58" stdDeviation="0.29" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="29" height="29" rx="5.22" ry="5.22" fill="url(#bg)"/>
  
  <!-- Sacred scarab symbol -->
  <g transform="translate(14.5, 14.5)">
    <!-- Scarab body -->
    <ellipse cx="0" cy="0" rx="4.35" ry="7.25" fill="#ffffff" opacity="0.9" filter="url(#shadow)"/>
    
    <!-- Scarab wings -->
    <ellipse cx="-2.9000000000000004" cy="-1.4500000000000002" rx="2.32" ry="4.35" fill="#ffffff" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="2.9000000000000004" cy="-1.4500000000000002" rx="2.32" ry="4.35" fill="#ffffff" opacity="0.7" transform="rotate(20)"/>
    
    <!-- Sacred geometry -->
    <circle cx="0" cy="-2.32" r="0.87" fill="#2d3748" opacity="0.6"/>
    <circle cx="0" cy="0" r="0.58" fill="#2d3748" opacity="0.8"/>
    <circle cx="0" cy="2.32" r="0.87" fill="#2d3748" opacity="0.6"/>
  </g>
  
  <!-- App name hint for larger sizes -->
  
</svg>