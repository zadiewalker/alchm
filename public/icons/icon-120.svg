<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a4b792;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8fa078;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="1.2" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="120" height="120" rx="21.599999999999998" ry="21.599999999999998" fill="url(#bg)"/>
  
  <!-- Sacred scarab symbol -->
  <g transform="translate(60, 60)">
    <!-- Scarab body -->
    <ellipse cx="0" cy="0" rx="18" ry="30" fill="#ffffff" opacity="0.9" filter="url(#shadow)"/>
    
    <!-- Scarab wings -->
    <ellipse cx="-12" cy="-6" rx="9.6" ry="18" fill="#ffffff" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="12" cy="-6" rx="9.6" ry="18" fill="#ffffff" opacity="0.7" transform="rotate(20)"/>
    
    <!-- Sacred geometry -->
    <circle cx="0" cy="-9.6" r="3.5999999999999996" fill="#2d3748" opacity="0.6"/>
    <circle cx="0" cy="0" r="2.4" fill="#2d3748" opacity="0.8"/>
    <circle cx="0" cy="9.6" r="3.5999999999999996" fill="#2d3748" opacity="0.6"/>
  </g>
  
  <!-- App name hint for larger sizes -->
  
</svg>