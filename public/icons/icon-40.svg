<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a4b792;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8fa078;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="40" height="40" rx="7.199999999999999" ry="7.199999999999999" fill="url(#bg)"/>
  
  <!-- Sacred scarab symbol -->
  <g transform="translate(20, 20)">
    <!-- Scarab body -->
    <ellipse cx="0" cy="0" rx="6" ry="10" fill="#ffffff" opacity="0.9" filter="url(#shadow)"/>
    
    <!-- Scarab wings -->
    <ellipse cx="-4" cy="-2" rx="3.2" ry="6" fill="#ffffff" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="4" cy="-2" rx="3.2" ry="6" fill="#ffffff" opacity="0.7" transform="rotate(20)"/>
    
    <!-- Sacred geometry -->
    <circle cx="0" cy="-3.2" r="1.2" fill="#2d3748" opacity="0.6"/>
    <circle cx="0" cy="0" r="0.8" fill="#2d3748" opacity="0.8"/>
    <circle cx="0" cy="3.2" r="1.2" fill="#2d3748" opacity="0.6"/>
  </g>
  
  <!-- App name hint for larger sizes -->
  
</svg>