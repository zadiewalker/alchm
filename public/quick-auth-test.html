<!DOCTYPE html>
<html>
<head>
    <title>Quick Firebase Auth Test</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        window.testAuth = async function() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing Firebase Auth with current API key...</p>';
            
            try {
                // Use your current API key from .env.local
                const firebaseConfig = {
                    apiKey: "AIzaSyCqjfzvykK6q55vLH7F0FEuyK0cppGhD3w",
                    authDomain: "alchm-digital-sanctuary.firebaseapp.com",
                    projectId: "alchm-digital-sanctuary",
                    storageBucket: "alchm-digital-sanctuary.appspot.com",
                    messagingSenderId: "10211111067",
                    appId: "1:10211111067:web:4f23562b8a1f63cd8c963e",
                    measurementId: "G-0RPJ2D5M1R"
                };

                const app = initializeApp(firebaseConfig, 'test-app-' + Date.now());
                const auth = getAuth(app);
                
                const provider = new GoogleAuthProvider();
                provider.addScope('profile');
                provider.addScope('email');
                
                console.log('🔥 Firebase Config:', firebaseConfig);
                console.log('🌍 Current Domain:', window.location.host);
                console.log('🔧 Auth instance:', auth);
                console.log('📋 Provider config:', provider);
                
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                results.innerHTML = `
                    <div style="color: green; background: rgba(0,255,0,0.1); padding: 15px; border-radius: 8px;">
                        <h3>✅ SUCCESS! Authentication Works!</h3>
                        <p><strong>User:</strong> ${user.displayName || 'No name'}</p>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <p><strong>UID:</strong> ${user.uid}</p>
                        <p><strong>API Key:</strong> ${firebaseConfig.apiKey.substring(0, 20)}...</p>
                    </div>
                `;
                
            } catch (error) {
                console.error('🚨 Full Firebase Error:', error);
                
                results.innerHTML = `
                    <div style="color: red; background: rgba(255,0,0,0.1); padding: 15px; border-radius: 8px;">
                        <h3>❌ FIREBASE AUTH FAILED</h3>
                        <p><strong>Error Code:</strong> ${error.code}</p>
                        <p><strong>Error Message:</strong> ${error.message}</p>
                        <p><strong>API Key Used:</strong> AIzaSyCqjfzvykK6q55vLH7F0FEuyK0cppGhD3w</p>
                        <p><strong>Current Domain:</strong> ${window.location.host}</p>
                        
                        <h4>🔧 Next Steps:</h4>
                        <ol style="text-align: left;">
                            <li>If API key error: Get new key from Firebase Console</li>
                            <li>If domain error: Add ${window.location.host} to authorized domains</li>
                            <li>If provider error: Enable Google sign-in method</li>
                        </ol>
                    </div>
                `;
            }
        };
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #a4b792 0%, #8fa37c 100%);
            color: white;
            border-radius: 20px;
        }
        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }
        #results {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <h1>🔥 Quick Firebase Auth Test</h1>
    <p><strong>Testing API Key:</strong> AIzaSyCqjfzvykK6q55vLH7F0FEuyK0cppGhD3w</p>
    <p><strong>Current Domain:</strong> <span id="domain"></span></p>
    
    <button onclick="testAuth()">🧪 Test Firebase Authentication</button>
    
    <div id="results">
        <p>Click the test button to verify if your Firebase configuration works.</p>
    </div>

    <script>
        document.getElementById('domain').textContent = window.location.href;
    </script>
</body>
</html>
