<!DOCTYPE html>
<html>
<head>
    <title>Minimal Auth Test</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        window.testMinimalAuth = async function() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>🔄 Testing minimal auth...</p>';
            
            try {
                const firebaseConfig = {
                    apiKey: "AIzaSyCqjfzvykK6q55vLH7F0FEuyK0cppGhD3w",
                    authDomain: "alchm-digital-sanctuary.firebaseapp.com",
                    projectId: "alchm-digital-sanctuary",
                    storageBucket: "alchm-digital-sanctuary.appspot.com",
                    messagingSenderId: "10211111067",
                    appId: "1:10211111067:web:4f23562b8a1f63cd8c963e",
                    measurementId: "G-0RPJ2D5M1R"
                };

                const app = initializeApp(firebaseConfig, 'minimal-test');
                const auth = getAuth(app);
                const provider = new GoogleAuthProvider();
                
                console.log('🔥 Attempting sign-in...');
                const result = await signInWithPopup(auth, provider);
                
                // Set session cookie like main app
                const isLocalhost = window.location.hostname === 'localhost';
                const secure = !isLocalhost ? 'secure;' : '';
                document.cookie = `alchm_session=${result.user.uid}; path=/; max-age=86400; ${secure} samesite=strict`;
                
                console.log('🔥 Success! Redirecting to dashboard...');
                
                // Test navigation
                window.location.href = '/dashboard';
                
                results.innerHTML = `
                    <div style="color: green; background: rgba(0,255,0,0.1); padding: 15px; border-radius: 8px;">
                        <h3>✅ SUCCESS! Redirecting to dashboard...</h3>
                        <p><strong>User:</strong> ${result.user.displayName}</p>
                        <p><strong>Email:</strong> ${result.user.email}</p>
                        <p>Redirecting in 3 seconds...</p>
                    </div>
                `;
                
                // Redirect after delay
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 3000);
                
            } catch (error) {
                console.error('Minimal auth error:', error);
                results.innerHTML = `
                    <div style="color: red; background: rgba(255,0,0,0.1); padding: 15px; border-radius: 8px;">
                        <h3>❌ Error: ${error.code}</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        };
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #a4b792 0%, #8fa37c 100%);
            color: white;
            border-radius: 20px;
        }
        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0;
            width: 100%;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }
        #results {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            min-height: 60px;
        }
    </style>
</head>
<body>
    <h1>🔐 Minimal Auth Test & Fix</h1>
    <p>This bypasses the React component completely to test if the issue is in the component or Firebase.</p>
    
    <button onclick="testMinimalAuth()">
        🔥 Sign In & Go to Dashboard
    </button>
    
    <div id="results">
        <p>This will authenticate and redirect to the dashboard if successful.</p>
    </div>
</body>
</html>
