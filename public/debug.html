<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ALCHM Debug</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, #8B9A7C, #A8B5A0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
      padding: 15px;
    }
    .debug-panel {
      background: rgba(255,255,255,0.1);
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      max-width: 450px;
      width: 100%;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .test-result {
      margin: 8px 0;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: left;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .pass { 
      background: rgba(34, 197, 94, 0.3); 
      border-color: rgba(34, 197, 94, 0.5);
    }
    .fail { 
      background: rgba(239, 68, 68, 0.3); 
      border-color: rgba(239, 68, 68, 0.5);
    }
    .pending { 
      background: rgba(251, 191, 36, 0.3); 
      border-color: rgba(251, 191, 36, 0.5);
    }
    .test-actions {
      margin: 20px 0;
    }
    .test-btn {
      display: inline-block;
      margin: 5px;
      padding: 10px 15px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .test-btn:hover {
      background: rgba(255,255,255,0.2);
    }
    .nav-section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .nav-link {
      display: block;
      margin: 8px 0;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      color: #D4A84B;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid rgba(212, 168, 75, 0.3);
    }
    .nav-link:hover {
      background: rgba(212, 168, 75, 0.1);
    }
    .error-detail {
      font-size: 11px;
      margin-top: 5px;
      opacity: 0.8;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="debug-panel">
    <h1>🔍 ALCHM Debug Panel</h1>
    <p style="margin: 0 0 20px 0; opacity: 0.8; font-size: 14px;">
      Comprehensive JavaScript & Capacitor Testing
    </p>
    
    <div id="test-results">
      <div class="test-result pending">⏳ Initializing debug tests...</div>
    </div>
    
    <div class="test-actions">
      <button class="test-btn" onclick="runAllTests()">🔄 Re-run All Tests</button>
      <button class="test-btn" onclick="testCapacitorPlugins()">📱 Test Capacitor Plugins</button>
      <button class="test-btn" onclick="clearResults()">🧹 Clear Results</button>
    </div>
    
    <div class="nav-section">
      <div style="margin-bottom: 15px; font-weight: 500;">🧭 Test Navigation:</div>
      <a href="/debug-react/" class="nav-link">⚛️ Test Basic React Component</a>
      <a href="/debug-hooks/" class="nav-link">🪝 Test React Hooks</a>
      <a href="/dashboard/" class="nav-link">🏠 Test Full Dashboard</a>
      <a href="/" class="nav-link">🏛️ Back to Root</a>
    </div>
    
    <div style="margin-top: 20px; font-size: 11px; opacity: 0.6;">
      Check iOS Console for detailed 🔍 debug messages
    </div>
  </div>

  <script>
    console.log('🔍 ALCHM Debug script starting...');
    console.log('🔍 Timestamp:', new Date().toISOString());
    console.log('🔍 User Agent:', navigator.userAgent);
    
    const results = document.getElementById('test-results');
    let tests = [];
    let testCount = 0;
    
    function addResult(test, status, message, detail = '') {
      testCount++;
      const icon = status === 'pass' ? '✅' : status === 'fail' ? '❌' : '⏳';
      const className = status === 'pass' ? 'pass' : status === 'fail' ? 'fail' : 'pending';
      
      const resultHtml = `
        <div class="test-result ${className}">
          ${icon} <strong>Test ${testCount}: ${test}</strong><br>
          ${message}
          ${detail ? `<div class="error-detail">${detail}</div>` : ''}
        </div>
      `;
      
      tests.push(resultHtml);
      results.innerHTML = tests.join('');
      
      const logMessage = `${icon} Test ${testCount}: ${test} - ${message}`;
      console.log(`🔍 ${logMessage}`);
      if (detail) console.log(`🔍 Detail: ${detail}`);
      
      // Auto-scroll to latest result
      results.scrollTop = results.scrollHeight;
    }
    
    function clearResults() {
      tests = [];
      testCount = 0;
      results.innerHTML = '<div class="test-result pending">⏳ Ready for testing...</div>';
      console.log('🔍 Results cleared');
    }
    
    async function runAllTests() {
      console.log('🔍 Starting comprehensive test suite...');
      clearResults();
      
      // Test 1: Basic JavaScript
      try {
        const testVar = 'test';
        const testObj = { key: 'value' };
        addResult('Basic JavaScript', 'pass', 'Variables, objects, and execution work');
      } catch (error) {
        addResult('Basic JavaScript', 'fail', 'Failed to execute basic JavaScript', error.message);
        return; // Stop if basic JS fails
      }
      
      // Test 2: DOM Manipulation
      try {
        const testDiv = document.createElement('div');
        testDiv.textContent = 'DOM test';
        testDiv.style.display = 'none';
        document.body.appendChild(testDiv);
        document.body.removeChild(testDiv);
        addResult('DOM Manipulation', 'pass', 'createElement, appendChild, removeChild work');
      } catch (error) {
        addResult('DOM Manipulation', 'fail', 'DOM operations failed', error.message);
      }
      
      // Test 3: Modern JavaScript Features
      try {
        const arrow = () => 'ES6';
        const template = `Template: ${arrow()}`;
        const [a, b] = [1, 2];
        const { spread, ...rest } = { spread: 1, other: 2 };
        const promise = Promise.resolve('async');
        addResult('ES6+ Features', 'pass', 'Arrow functions, templates, destructuring, spread work');
      } catch (error) {
        addResult('ES6+ Features', 'fail', 'Modern JavaScript features failed', error.message);
      }
      
      // Test 4: Async/Await
      try {
        await new Promise(resolve => setTimeout(resolve, 10));
        const result = await Promise.resolve('async works');
        addResult('Async/Await', 'pass', 'Promises and async/await functional');
      } catch (error) {
        addResult('Async/Await', 'fail', 'Async operations failed', error.message);
      }
      
      // Test 5: Local Storage
      try {
        localStorage.setItem('alchm-debug-test', 'working');
        const value = localStorage.getItem('alchm-debug-test');
        localStorage.removeItem('alchm-debug-test');
        if (value === 'working') {
          addResult('Local Storage', 'pass', 'Read/write operations successful');
        } else {
          addResult('Local Storage', 'fail', 'Data integrity issue', `Expected 'working', got '${value}'`);
        }
      } catch (error) {
        addResult('Local Storage', 'fail', 'Storage operations failed', error.message);
      }
      
      // Test 6: Network Capabilities
      try {
        const response = await fetch('data:text/plain,test-data');
        const text = await response.text();
        if (text === 'test-data') {
          addResult('Network Fetch', 'pass', 'Fetch API and data URIs work');
        } else {
          addResult('Network Fetch', 'fail', 'Fetch response mismatch', `Got: ${text}`);
        }
      } catch (error) {
        addResult('Network Fetch', 'fail', 'Network operations failed', error.message);
      }
      
      // Test 7: Capacitor Detection
      try {
        const hasCapacitor = !!(window.Capacitor);
        const platform = hasCapacitor ? window.Capacitor.getPlatform() : 'web';
        const isNative = hasCapacitor ? window.Capacitor.isNativePlatform() : false;
        
        addResult(
          'Capacitor Detection', 
          'pass', 
          `Platform: ${platform}, Native: ${isNative}, Available: ${hasCapacitor}`
        );
      } catch (error) {
        addResult('Capacitor Detection', 'fail', 'Capacitor API failed', error.message);
      }
      
      // Test 8: Global Environment
      try {
        const globals = {
          window: typeof window !== 'undefined',
          document: typeof document !== 'undefined',
          console: typeof console !== 'undefined',
          setTimeout: typeof setTimeout !== 'undefined',
          fetch: typeof fetch !== 'undefined',
          localStorage: typeof localStorage !== 'undefined',
          navigator: typeof navigator !== 'undefined'
        };
        
        const missing = Object.entries(globals).filter(([key, available]) => !available);
        
        if (missing.length === 0) {
          addResult('Global Environment', 'pass', 'All essential APIs available');
        } else {
          addResult('Global Environment', 'fail', 'Missing APIs', `Missing: ${missing.map(([k]) => k).join(', ')}`);
        }
      } catch (error) {
        addResult('Global Environment', 'fail', 'Environment check failed', error.message);
      }
      
      // Test 9: Error Handling
      try {
        throw new Error('Test error for handling');
      } catch (error) {
        if (error.message === 'Test error for handling') {
          addResult('Error Handling', 'pass', 'Try/catch blocks work correctly');
        } else {
          addResult('Error Handling', 'fail', 'Error message mismatch', error.message);
        }
      }
      
      // Test 10: Performance APIs
      try {
        const start = performance.now();
        await new Promise(resolve => setTimeout(resolve, 5));
        const end = performance.now();
        const duration = end - start;
        
        if (duration > 0 && duration < 100) {
          addResult('Performance APIs', 'pass', `Timing works (${duration.toFixed(2)}ms)`);
        } else {
          addResult('Performance APIs', 'fail', 'Timing seems incorrect', `Duration: ${duration}ms`);
        }
      } catch (error) {
        addResult('Performance APIs', 'fail', 'Performance API failed', error.message);
      }
      
      console.log('🔍 All core tests completed');
      
      // Add summary
      const passCount = tests.filter(t => t.includes('✅')).length;
      const failCount = tests.filter(t => t.includes('❌')).length;
      
      setTimeout(() => {
        results.innerHTML += `
          <div class="test-result ${failCount > 0 ? 'fail' : 'pass'}" style="margin-top: 15px; text-align: center; font-weight: bold;">
            📊 Summary: ${passCount} passed, ${failCount} failed
            ${failCount === 0 ? '<br>🎉 All systems operational!' : '<br>⚠️ Issues detected - check failures above'}
          </div>
        `;
      }, 500);
    }
    
    async function testCapacitorPlugins() {
      if (!window.Capacitor) {
        addResult('Capacitor Plugins', 'fail', 'Capacitor not available');
        return;
      }
      
      console.log('🔍 Testing Capacitor plugins...');
      
      // Test Device plugin
      try {
        if (window.Capacitor.Plugins?.Device) {
          const deviceInfo = await window.Capacitor.Plugins.Device.getInfo();
          addResult('Device Plugin', 'pass', `Model: ${deviceInfo.model}, OS: ${deviceInfo.operatingSystem}`);
        } else {
          addResult('Device Plugin', 'fail', 'Device plugin not available');
        }
      } catch (error) {
        addResult('Device Plugin', 'fail', 'Device info failed', error.message);
      }
      
      // Test Network plugin
      try {
        if (window.Capacitor.Plugins?.Network) {
          const networkStatus = await window.Capacitor.Plugins.Network.getStatus();
          addResult('Network Plugin', 'pass', `Connected: ${networkStatus.connected}, Type: ${networkStatus.connectionType}`);
        } else {
          addResult('Network Plugin', 'fail', 'Network plugin not available');
        }
      } catch (error) {
        addResult('Network Plugin', 'fail', 'Network status failed', error.message);
      }
      
      // Test SplashScreen plugin
      try {
        if (window.Capacitor.Plugins?.SplashScreen) {
          await window.Capacitor.Plugins.SplashScreen.hide({ fadeOutDuration: 300 });
          addResult('SplashScreen Plugin', 'pass', 'Hide function executed');
        } else {
          addResult('SplashScreen Plugin', 'fail', 'SplashScreen plugin not available');
        }
      } catch (error) {
        addResult('SplashScreen Plugin', 'fail', 'SplashScreen failed', error.message);
      }
    }
    
    // Auto-run tests on page load
    window.addEventListener('load', () => {
      console.log('🔍 Page loaded, starting auto-tests...');
      setTimeout(runAllTests, 500);
    });
    
    // Global error handler
    window.addEventListener('error', (event) => {
      console.error('🔍 Global error:', event.error);
      addResult('Global Error', 'fail', event.error?.message || 'Unknown error', event.filename + ':' + event.lineno);
    });
    
    // Unhandled promise rejection handler
    window.addEventListener('unhandledrejection', (event) => {
      console.error('🔍 Unhandled promise rejection:', event.reason);
      addResult('Promise Rejection', 'fail', event.reason?.message || 'Unknown promise error');
    });
    
    console.log('🔍 Debug script initialization complete');
  </script>
</body>
</html>
