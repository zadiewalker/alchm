<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCHM Force Update</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #a4b792, #8fa67e);
            color: white;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
            min-width: 200px;
            min-height: 52px;
        }
        button:hover {
            background: #b91c1c;
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 12px;
            font-weight: 500;
        }
        .success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .info {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .warning {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 48px; margin-bottom: 20px;">🪲</div>
        <h1>🌿 Sacred Cache Clear</h1>
        <p>Clear your cache to see the new Sacred design with the ALCHM scarab and trauma-informed styling.</p>
        
        <div id="status"></div>
        
        <button onclick="forceUpdate()" id="updateBtn">
            🌿 Clear Sacred Cache
        </button>
        
        <button onclick="goToApp()">
            🏠 Go to ALCHM
        </button>
        
        <div style="margin-top: 30px; font-size: 14px; opacity: 0.8;">
            <p><strong>What this does:</strong></p>
            <p>• Clears all browser caches<br>
            • Forces service worker refresh<br>
            • Reloads with latest version<br>
            • Ensures proper button sizes</p>
        </div>
    </div>

    <script>
        const CURRENT_VERSION = 'v1763369189670-sacred';
        
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="${type}">${message}</div>`;
        }
        
        function showSpinner() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="spinner"></div>';
        }
        
        async function forceUpdate() {
            const updateBtn = document.getElementById('updateBtn');
            updateBtn.disabled = true;
            updateBtn.textContent = '🔄 Updating...';
            
            try {
                showStatus('🧹 Clearing browser caches...', 'info');
                
                // Clear all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(
                        cacheNames.map(cacheName => {
                            console.log('Deleting cache:', cacheName);
                            return caches.delete(cacheName);
                        })
                    );
                }
                
                // Clear localStorage and sessionStorage
                localStorage.clear();
                sessionStorage.clear();
                
                // Clear IndexedDB (for Firebase offline data)
                if ('indexedDB' in window) {
                    const databases = await indexedDB.databases();
                    for (const db of databases) {
                        if (db.name?.includes('firebase') || db.name?.includes('alchm')) {
                            indexedDB.deleteDatabase(db.name);
                        }
                    }
                }
                
                showStatus('🔄 Forcing service worker refresh...', 'info');
                
                // Force service worker update
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) {
                        await registration.unregister();
                    }
                    
                    // Register new emergency service worker
                    await navigator.serviceWorker.register(`/emergency-sw.js?v=${CURRENT_VERSION}`, {
                        updateViaCache: 'none'
                    });
                }
                
                // Set version marker
                localStorage.setItem('alchm-version', CURRENT_VERSION);
                localStorage.setItem('alchm-force-update', Date.now().toString());
                
                showStatus('✅ Cache cleared! Redirecting to updated ALCHM...', 'success');
                
                setTimeout(() => {
                    window.location.href = `https://alchmapp.web.app/?v=${CURRENT_VERSION}&force=true&t=${Date.now()}`;
                }, 2000);
                
            } catch (error) {
                console.error('Update failed:', error);
                showStatus('⚠️ Update failed. Try refreshing this page.', 'warning');
                updateBtn.disabled = false;
                updateBtn.textContent = '🔄 Try Again';
            }
        }
        
        function goToApp() {
            window.location.href = `https://alchmapp.web.app/?v=${CURRENT_VERSION}&t=${Date.now()}`;
        }
        
        // Auto-check cache status on load
        window.addEventListener('load', async () => {
            try {
                const storedVersion = localStorage.getItem('alchm-version');
                if (storedVersion && storedVersion !== CURRENT_VERSION) {
                    showStatus('🔍 Old version detected. Update recommended.', 'warning');
                } else {
                    showStatus('👍 Ready to force update if needed.', 'success');
                }
                
                // Check service worker status
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    const hasEmergencySW = registrations.some(reg => 
                        reg.active?.scriptURL.includes('emergency-sw.js')
                    );
                    
                    if (!hasEmergencySW) {
                        showStatus('⚡ Emergency cache system not active. Update needed.', 'warning');
                    }
                }
            } catch (error) {
                console.log('Cache check failed:', error);
            }
        });
        
        // Handle force update from URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('auto') === 'true') {
            setTimeout(() => forceUpdate(), 1000);
        }
    </script>
</body>
</html>
