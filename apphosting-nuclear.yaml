# FIREBASE STUDIO NUCLEAR CACHE-BUSTING CONFIGURATION
# FORCES FRESH READ - NO SECRET DEPENDENCIES
# Build ID: NUCLEAR-$(date +%s)

runConfig:
  cpu: 1
  memory: 2048Mi
  minInstances: 0
  maxInstances: 100
  concurrency: 1000
  timeoutSeconds: 60

env:
  # FORCE REFRESH MARKERS
  - variable: CACHE_BUSTER
    value: "nuclear-$(date +%s)"
  - variable: CONFIG_VERSION
    value: "v5-nuclear-bypass"
  - variable: FIREBASE_STUDIO_OVERRIDE
    value: "FORCE_FRESH_CONFIG"
    
  # Core Configuration - NO SECRETS
  - variable: NODE_ENV
    value: production
  - variable: BUILD_TARGET
    value: firebase-studio-nuclear
  
  # Firebase Configuration (PUBLIC ONLY)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCqjfzvykK6q55vLH7F0FEuyK0cppGhD3w
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: alchm-digital-sanctuary.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: alchm-digital-sanctuary
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: alchm-digital-sanctuary.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "171911707668"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:171911707668:web:9750f89ed6f6352a257b01

  # Environment Configuration
  - variable: NEXT_PUBLIC_ENVIRONMENT
    value: production
  - variable: FIREBASE_PROJECT_ID
    value: alchm-digital-sanctuary

# MINIMAL BUILD CONFIG - LET BUILDPACKS HANDLE EVERYTHING
# NO SECRET REFERENCES WHATSOEVER

trafficConfig:
  split:
    - identifier: nuclear-main
      percent: 100

healthCheck:
  path: "/api/health/ping"