name: ALCHM CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: 18.17.0
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  NEXT_PUBLIC_APP_ENV: "production"

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type check (TS)
        run: npx tsc --noEmit

      - name: Run unit & integration tests
        run: npm test

      - name: Run Firebase Emulator Tests
        run: |
          npm install -g firebase-tools
          firebase emulators:exec "npm run test:e2e"

      - name: Build Next.js App
        run: npm run build

      - name: Verify YAML Hardening Config
        run: |
          echo "Validating ALCHM_PUBLISH_HARDENING.yaml"
          npx ajv validate -s ./config/ALCHM_PUBLISH_HARDENING.schema.json -d ./config/ALCHM_PUBLISH_HARDENING.yaml

      - name: Firebase Deploy
        if: github.ref == 'refs/heads/main'
        run: firebase deploy --only hosting,functions,firestore --project ${{ env.FIREBASE_PROJECT_ID }}

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main'
        run: |
          npx vercel --token ${{ env.VERCEL_TOKEN }} --prod --yes

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "*ALCHM Deploy Pipeline* - Status: ${{ job.status }}",
              "attachments": [
                {
                  "text": "Branch: ${{ github.ref }}\nCommit: ${{ github.sha }}\nTriggered by: ${{ github.actor }}"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
