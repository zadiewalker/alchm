name: Navigation E2E

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  navigation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright Browser
        run: npx playwright install chromium

      - name: Run Navigation E2E Suite
        run: npm run e2e:navigation
