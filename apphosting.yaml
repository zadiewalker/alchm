# Firebase App Hosting - Next.js 14 Compatible Configuration
runConfig:
  runtime: nodejs20
  
# Environment for Next.js 14
env:
  - variable: NODE_ENV
    value: production
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"

# Simple build commands for Next.js 14
buildConfig:
  commands:
    - npm ci --quiet
    - npm run build

startCommand: npm start

# Resource allocation
resources:
  cpu: 1
  memoryGb: 1
  
# Scaling
minInstances: 0
maxInstances: 10
concurrency: 80