# Firebase App Hosting configuration for ALCHM
# Trauma-informed Next.js application with dynamic routes

runConfig:
  # Sufficient resources for trauma-informed AI processing
  cpu: 1
  memory: 1GiB
  maxInstances: 10
  minInstances: 0
  concurrency: 1000

env:
  # Next.js production environment
  - variable: NODE_ENV
    value: production
  
  # Firebase configuration (from environment variables)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
  
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
  
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
  
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
  
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    secret: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
  
  # Stripe configuration
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
  
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY

# Build configuration optimized for trauma-informed features
build:
  commands:
    # Install dependencies with optimizations
    - npm ci --prefer-offline --no-audit
    
    # Build Next.js application with performance optimizations
    - npm run build
    
    # Verify critical trauma-informed features are built
    - echo "Verifying critical trauma-informed components..."
    - test -f .next/server/app/dashboard/page.js || (echo "Dashboard page missing" && exit 1)
    - test -f .next/server/app/journal/page.js || (echo "Journal page missing" && exit 1)
    - test -f .next/server/app/auth/login/page.js || (echo "Auth page missing" && exit 1)
    
    # Verify static assets
    - test -d .next/static || (echo "Static assets missing" && exit 1)
    
    # Performance verification
    - echo "Build verification complete - trauma-informed features ready"

# Headers for trauma-informed security and performance
headers:
  - source: "**"
    headers:
      - key: "X-Frame-Options"
        value: "DENY"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - key: "X-Crisis-Support"
        value: "tel:988"
      - key: "Content-Security-Policy"
        value: "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com wss://*.firebaseapp.com; font-src 'self' data:;"

  # Optimize static assets
  - source: "/_next/static/**"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
      - key: "X-Trauma-Informed"
        value: "performance-optimized"

  # Crisis resources should never be cached aggressively
  - source: "/api/crisis-detection/**"
    headers:
      - key: "Cache-Control"
        value: "no-cache, no-store, must-revalidate"
      - key: "X-Crisis-Critical"
        value: "immediate-response-required"

# Redirects for trauma-informed UX
redirects:
  # Ensure authenticated routes are protected
  - source: "/dashboard"
    destination: "/auth/login"
    type: 302
    condition: "!auth"
  
  - source: "/journal"
    destination: "/auth/login" 
    type: 302
    condition: "!auth"
  
  - source: "/journals"
    destination: "/auth/login"
    type: 302
    condition: "!auth"

# Rewrites for API routes that should go to Cloud Functions
rewrites:
  # Crisis detection (always accessible)
  - source: "/api/crisis-detection/**"
    destination: "https://us-central1-{PROJECT_ID}.cloudfunctions.net/crisisDetection"
  
  # Khepera AI guidance
  - source: "/api/khepera/**"
    destination: "https://us-central1-{PROJECT_ID}.cloudfunctions.net/chatWithGemini"
  
  # Stripe webhook
  - source: "/api/stripe/webhook"
    destination: "https://us-central1-{PROJECT_ID}.cloudfunctions.net/subscriptionWebhook"