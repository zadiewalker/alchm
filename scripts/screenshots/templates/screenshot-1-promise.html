<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: VAR_WIDTHpx;
    height: VAR_HEIGHTpx;
    background: #8A9B76;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
  }

  .scarab {
    width: 220px;
    height: 220px;
    margin-bottom: 80px;
    opacity: 0.92;
  }

  .headline {
    font-family: Georgia, serif;
    font-size: 72px;
    font-weight: 300;
    color: #F5F0E8;
    text-align: center;
    line-height: 1.15;
    letter-spacing: -0.01em;
    max-width: 900px;
    margin-bottom: 40px;
  }

  .subline {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 38px;
    font-weight: 300;
    color: rgba(245,240,232,0.60);
    text-align: center;
    letter-spacing: 0.02em;
    line-height: 1.5;
    max-width: 800px;
  }

  .wordmark {
    position: absolute;
    bottom: 120px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 36px;
    font-weight: 300;
    color: rgba(245,240,232,0.35);
    letter-spacing: 0.22em;
  }
</style>
</head>
<body>

<!-- Scarab SVG — inline so no external dependencies -->
<svg class="scarab" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Sun disk -->
  <circle cx="100" cy="18" r="18" fill="#D4B86A"/>
  <!-- Connector -->
  <ellipse cx="100" cy="42" rx="9" ry="12" fill="rgba(245,240,232,0.75)"/>
  <!-- Body -->
  <ellipse cx="100" cy="110" rx="36" ry="50" fill="rgba(245,240,232,0.82)"/>
  <!-- Stripes -->
  <line x1="70" y1="90" x2="130" y2="90" stroke="rgba(138,155,118,0.5)" stroke-width="2.5"/>
  <line x1="68" y1="103" x2="132" y2="103" stroke="rgba(138,155,118,0.5)" stroke-width="2.5"/>
  <line x1="68" y1="116" x2="132" y2="116" stroke="rgba(138,155,118,0.5)" stroke-width="2.5"/>
  <line x1="70" y1="129" x2="130" y2="129" stroke="rgba(138,155,118,0.5)" stroke-width="2.5"/>
  <!-- Left wing -->
  <ellipse cx="55" cy="115" rx="28" ry="40"
    fill="rgba(245,240,232,0.65)"
    transform="rotate(-15, 55, 115)"/>
  <!-- Right wing -->
  <ellipse cx="145" cy="115" rx="28" ry="40"
    fill="rgba(245,240,232,0.65)"
    transform="rotate(15, 145, 115)"/>
  <!-- Left antenna -->
  <path d="M 80 65 Q 55 45 40 30" stroke="rgba(245,240,232,0.55)"
    stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Right antenna -->
  <path d="M 120 65 Q 145 45 160 30" stroke="rgba(245,240,232,0.55)"
    stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>

<p class="headline">A sanctuary for<br>your inner life.</p>
<p class="subline">Journaling with an AI companion<br>that actually listens.</p>

<p class="wordmark">ALCHM</p>

</body>
</html>
