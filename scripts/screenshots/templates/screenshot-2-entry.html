<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: VAR_WIDTHpx;
    height: VAR_HEIGHTpx;
    background: #8A9B76;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Headline above the device */
  .headline-block {
    padding: 100px 80px 60px;
    text-align: center;
  }

  .kicker {
    font-size: 28px;
    font-weight: 400;
    color: rgba(245,240,232,0.50);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .headline {
    font-family: Georgia, serif;
    font-size: 88px;
    font-weight: 300;
    color: #F5F0E8;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  /* Phone mockup */
  .phone {
    width: 560px;
    background: #7A8B67;
    border-radius: 60px;
    border: 2px solid rgba(245,240,232,0.15);
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }

  .phone-inner {
    padding: 50px 36px 36px;
  }

  /* Phase indicator */
  .phases {
    display: flex;
    gap: 8px;
    margin-bottom: 48px;
    justify-content: center;
  }

  .phase {
    height: 4px;
    border-radius: 2px;
    background: rgba(245,240,232,0.20);
    flex: 1;
  }

  .phase.active {
    background: rgba(245,240,232,0.75);
  }

  .phase.done {
    background: rgba(245,240,232,0.45);
  }

  .phase-labels {
    display: flex;
    justify-content: space-between;
    margin-bottom: 48px;
    margin-top: 10px;
  }

  .phase-label {
    font-size: 18px;
    color: rgba(245,240,232,0.35);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .phase-label.active {
    color: rgba(245,240,232,0.75);
  }

  /* Writing prompt */
  .prompt-text {
    font-family: Georgia, serif;
    font-size: 44px;
    font-weight: 300;
    color: #F5F0E8;
    line-height: 1.3;
    margin-bottom: 36px;
  }

  /* Textarea simulation */
  .textarea {
    background: rgba(0,0,0,0.15);
    border: 0.5px solid rgba(245,240,232,0.20);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 28px;
  }

  .textarea-text {
    font-family: Arial, sans-serif;
    font-size: 30px;
    font-weight: 300;
    color: rgba(245,240,232,0.80);
    line-height: 1.7;
  }

  .textarea-cursor {
    display: inline-block;
    width: 2px;
    height: 32px;
    background: #D4B86A;
    vertical-align: middle;
    margin-left: 2px;
  }

  /* Presence indicator */
  .presence {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .presence-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(245,240,232,0.25);
  }

  .presence-text {
    font-size: 22px;
    color: rgba(245,240,232,0.35);
    font-style: italic;
  }

  /* Send button */
  .btn {
    width: 100%;
    height: 72px;
    background: rgba(0,0,0,0.18);
    border: 0.5px solid rgba(245,240,232,0.30);
    border-radius: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 500;
    color: #F5F0E8;
  }
</style>
</head>
<body>

<div class="headline-block">
  <p class="kicker">The entry experience</p>
  <p class="headline">Write what's<br>hard to say.</p>
</div>

<div class="phone">
  <div class="phone-inner">

    <!-- Phase progress -->
    <div class="phases">
      <div class="phase done"></div>
      <div class="phase done"></div>
      <div class="phase active"></div>
      <div class="phase"></div>
    </div>
    <div class="phase-labels">
      <span class="phase-label">Arriving</span>
      <span class="phase-label">Feeling</span>
      <span class="phase-label active">Writing</span>
      <span class="phase-label">Receiving</span>
    </div>

    <p class="prompt-text">What's present<br>for you today?</p>

    <div class="textarea">
      <p class="textarea-text">
        I keep waking up at 3am and lying there
        thinking about the conversation we never
        had. It's not grief exactly —<span class="textarea-cursor"></span>
      </p>
    </div>

    <div class="presence">
      <div class="presence-dot"></div>
      <span class="presence-text">Khepera is here</span>
    </div>

    <div class="btn">Send to Khepera</div>

  </div>
</div>

</body>
</html>
